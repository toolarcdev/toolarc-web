  <rect x="36" y="468" width="1128" height="142" rx="18" fill="#30343b"/>
  <line x1="54" y1="514" x2="1146" y2="514" stroke="#8f969f" stroke-width="1"/>
  <line x1="54" y1="557" x2="1146" y2="557" stroke="#8f969f" stroke-width="1"/>
  <g font-family="Yu Gothic, Meiryo, sans-serif" fill="#ffffff">
    <text x="82" y="501" font-size="20" font-weight="700">Free（APIキーなし）</text>
    <text x="400" y="501" font-size="22" font-weight="600">Cursor Grok 4.6 Medium固定</text>
    <text x="82" y="545" font-size="20" font-weight="700">有料プラン</text>
