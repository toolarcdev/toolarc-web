    <rect x="644" y="275" width="490" height="42" rx="12" fill="#ffffff"/>
    <text x="889" y="304" text-anchor="middle">Claude Opus 5.5</text>
    <rect x="644" y="332" width="490" height="42" rx="12" fill="#ffffff"/>
