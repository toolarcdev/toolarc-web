    <rect x="66" y="389" width="490" height="42" rx="12" fill="#ffffff"/>
    <text x="311" y="418" text-anchor="middle">Muse Spark 1.3</text>
  </g>

  <rect x="614" y="136" width="550" height="312" rx="22" fill="#f5f0ff" stroke="#6f28eb" stroke-width="3"/>
  <path d="M636 136h506a22 22 0 0 1 22 22v42H614v-42a22 22 0 0 1 22-22z" fill="#6f28eb"/>
  <text x="889" y="178" text-anchor="middle" fill="#ffffff" font-family="Yu Gothic, Meiryo, sans-serif" font-size="28" font-weight="700">複雑さ・長時間</text>
  <g font-family="Yu Gothic, Meiryo, sans-serif" font-size="23" font-weight="600" fill="#10254f">
    <rect x="644" y="218" width="490" height="42" rx="12" fill="#ffffff"/>
