    <text x="311" y="247" text-anchor="middle">Composer 2.5</text>
    <rect x="66" y="275" width="490" height="42" rx="12" fill="#ffffff"/>
    <text x="311" y="304" text-anchor="middle">Claude Sonnet 5.5</text>
    <rect x="66" y="332" width="490" height="42" rx="12" fill="#ffffff"/>
