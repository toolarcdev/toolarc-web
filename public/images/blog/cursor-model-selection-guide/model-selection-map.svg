<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">

  <defs>

    <style>
      .title{
        font:700 34px "Segoe UI",sans-serif;
        fill:#1e293b;
      }

      .subtitle{
        font:18px "Segoe UI",sans-serif;
        fill:#64748b;
      }

      .axis{
        stroke:#94a3b8;
        stroke-width:2.5;
      }

      .label{
        font:700 18px "Segoe UI",sans-serif;
        fill:#334155;
      }

      .card{
        fill:#f8fbff;
        stroke:#60a5fa;
        stroke-width:2;
        rx:16;
      }

      .name{
        font:700 18px "Segoe UI",sans-serif;
        fill:#2563eb;
      }

      .desc{
        font:15px "Segoe UI",sans-serif;
        fill:#475569;
      }

    </style>

    <!-- 外向き矢印 -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"></path>
    </marker>

  </defs>

  <rect width="1200" height="800" fill="white"></rect>

  <!-- タイトル -->

  <text x="600" y="60" class="title" text-anchor="middle">
      用途別・使い分けマップ
  </text>

  <text x="600" y="92" class="subtitle" text-anchor="middle">
      作業内容に応じて最適なAIモデルを選択
  </text>

  <!-- 横軸（左向き） -->

  <line x1="600" y1="400" x2="200" y2="400" class="axis" marker-end="url(#arrow)"></line>

  <!-- 横軸（右向き） -->

  <line x1="600" y1="400" x2="1000" y2="400" class="axis" marker-end="url(#arrow)"></line>

  <!-- 縦軸（上向き） -->

  <line x1="600" y1="400" x2="600" y2="170" class="axis" marker-end="url(#arrow)"></line>

  <!-- 縦軸（下向き） -->

  <line x1="600" y1="400" x2="600" y2="630" class="axis" marker-end="url(#arrow)"></line>

  <!-- 軸ラベル -->

  <text x="600" y="135" text-anchor="middle" class="label">
    高難度・長時間自律
  </text>

  <text x="600" y="690" text-anchor="middle" class="label">
    日常利用
  </text>

  <text x="115" y="395" text-anchor="middle" class="label">
    コスト
  </text>

  <text x="115" y="420" text-anchor="middle" class="label">
    重視
  </text>

  <text x="1085" y="407" text-anchor="middle" class="label">
    高性能
  </text>

  <!-- Claude Opus -->

  <rect x="700" y="180" width="220" height="78" class="card"></rect>
  <text x="720" y="212" class="name">Claude Opus</text>
  <text x="720" y="236" class="desc">複雑設計・難問解決</text>

  <!-- GPT -->

  <rect x="760" y="295" width="220" height="78" class="card"></rect>
  <text x="780" y="327" class="name">GPT-5.x</text>
  <text x="780" y="351" class="desc">高度解析・推論</text>

  <!-- Sonnet -->

  <rect x="690" y="500" width="220" height="78" class="card"></rect>
  <text x="710" y="532" class="name">Claude Sonnet</text>
  <text x="710" y="556" class="desc">日常開発の定番</text>

  <!-- Gemini -->

  <rect x="820" y="560" width="220" height="78" class="card"></rect>
  <text x="840" y="592" class="name">Gemini</text>
  <text x="840" y="616" class="desc">高速・日常利用</text>

  <!-- Kimi -->

  <rect x="230" y="505" width="220" height="78" class="card"></rect>
  <text x="250" y="537" class="name">Kimi K2/K3</text>
  <text x="250" y="561" class="desc">コストパフォーマンス</text>

  <!-- OSS -->

  <rect x="230" y="215" width="220" height="78" class="card"></rect>
  <text x="250" y="247" class="name">OSSモデル</text>
  <text x="250" y="271" class="desc">長時間運用・低コスト</text>

</svg>